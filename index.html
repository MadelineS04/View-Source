<!DOCTYPE html>

<html lang="en">

  <head>
    <Meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look Up/</title>

<style> 
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #080808;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone {
    width: 450px;
    height: 900px;
    background: #050505;
    border: 7px solid #242424;
    border-radius: 55px;
    padding: 10px;
  }

  .screen {
    height: 100%;
    position: relative;
    background: #101010;
    border-radius: 43px;
    padding: 150px 35px;
    overflow: hidden;
  }

  .camera {
    position: absolute;
    top: 18px;
    left: 50%;
    width: 115px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    transform: translateX(-50%);
  }
  
  .statement {
    font-size: 48px;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 80px;
  }

  .small {
    color: #777;
    font-size: 34px;
  }

  .conversation {
    display: flex;
    flex-direction: column;
    gap: 65px;
  }

  .bubble {
    padding: 24px 28px;
    border-radius: 28px;
    font-size: 25px;
    max-width: 90%;
  }

  .one {
    background: #292929;
    align-self: flex-start;
  }

  .two {
    background: #3d5d78;
    align-self: flex-end;
  }

  .source {
    position: absolute;
    bottom: 45px;
    left: 50%;
    color: #777;
    font-size: 13px;
    text-decoration: none;
    transform: translateX(-50%);
  }

  .home {
    position: absolute;
    bottom: 16px;
    left: 50%;
    width: 120px;
    height: 5px;
    background: #eee;
    border-radius: 10px;
    transform: translateX(-50%);
  }

  @media (max-width: 500px) {
    .phone {
      width: 100vw;
      height: 100vh;
      border: 0;
      border-radius: 0;
      padding: 0;
    }

    .screen {
      border-radius: 0;
    }
  }
</style>
</head>

<body>

  <div class="phone">
    <div class="screen">

      <div class="camera"></div>

      <div class="statement">
        Technology should<br>
        connect us,<br>
        <span class="small">not replace real life.</span>
      </div>

      <div class="conversation">
        <div class="bubble one">
          The world is happening beyond the screen.
        </div>

        <div class="bubble two">
          Look up.
        </div>
      </div>

      <a class="source"
        href="https://www.sogolytics.com/blog/how-has-technology-affected-social-interaction/">
        Learn more →
      </a>

      <div class="home"></div>

    </div>
  </div>
  
  </body>
  </html>

<!DOCTYPE html>

<html lang="en">

  <head>
    <Meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look Up/</title>

<style> 
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #080808;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone {
    width: 450px;
    height: 900px;
    background: #050505;
    border: 7px solid #242424;
    border-radius: 55px;
    padding: 10px;
  }

  .screen {
    height: 100%;
    position: relative;
    background: #101010;
    border-radius: 43px;
    padding: 150px 35px;
    overflow: hidden;
  }

  .camera {
    position: absolute;
    top: 18px;
    left: 50%;
    width: 115px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    transform: translateX(-50%);
  }




  
  </body>
  </html>
